# Built by installer/linux/package.sh. The program loads its display libraries at
# runtime, so they don't show up as linked libraries and have to be listed here.
# curl downloads updates.
name: daleris
version: "${VERSION}"
arch: "${PKG_ARCH}"
platform: linux
section: utils
priority: optional
maintainer: "MyDrift <121827219+MyDrift-user@users.noreply.github.com>"
description: A file explorer built for speed, with everything you expect from a modern one.
homepage: https://github.com/MyDrift-user/daleris
license: GPL-3.0-only
contents:
  - src: target/release/daleris
    dst: /usr/bin/daleris
    file_info: { mode: 0755 }
  - src: installer/linux/daleris.desktop
    dst: /usr/share/applications/daleris.desktop
  - src: assets/logo.png
    dst: /usr/share/icons/hicolor/256x256/apps/daleris.png
  - src: LICENSE
    dst: /usr/share/licenses/daleris/LICENSE
  - src: THIRD-PARTY-NOTICES.txt
    dst: /usr/share/licenses/daleris/THIRD-PARTY-NOTICES.txt
overrides:
  deb:
    depends: [curl, libc6, libgcc-s1, libgl1, libegl1, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6, libxrandr2, libwayland-client0, libwayland-cursor0, libwayland-egl1]
    recommends: [libglib2.0-bin, xdg-utils, zenity]
  # Library names rather than package names, which differ between Fedora and openSUSE.
  rpm:
    depends:
      - curl
      - "libGL.so.1()(64bit)"
      - "libEGL.so.1()(64bit)"
      - "libxkbcommon.so.0()(64bit)"
      - "libxkbcommon-x11.so.0()(64bit)"
      - "libX11.so.6()(64bit)"
      - "libX11-xcb.so.1()(64bit)"
      - "libXcursor.so.1()(64bit)"
      - "libXi.so.6()(64bit)"
      - "libXrandr.so.2()(64bit)"
      - "libwayland-client.so.0()(64bit)"
      - "libwayland-cursor.so.0()(64bit)"
      - "libwayland-egl.so.1()(64bit)"
  archlinux:
    depends: [curl, libglvnd, libxkbcommon, libxkbcommon-x11, libx11, libxcursor, libxi, libxrandr, wayland]
