[package]
name = "daleris"
version = "0.0.4"
edition = "2021"
license = "GPL-3.0-only"

[workspace]
members = [".", "crates/integration", "crates/open", "crates/dialogs", "crates/shell-test"]

[features]
# Only for the release workflow's update test: trusts a published key instead of the real ones. See src/update.rs.
update-test = []

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui-phosphor = { version = "0.9", default-features = false, features = ["regular", "fill"] }
log = "0.4"
png = "0.18"
regex = "1.11"
resvg = { version = "0.49", default-features = false }
sha2 = "0.10"
daleris-integration = { path = "crates/integration" }


[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

# Linux and macOS back-end
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

# Linux needs a display protocol: both X11 and Wayland
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

# Debug builds are what get checked, so keep them quick at runtime too.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
