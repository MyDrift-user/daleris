[package]
name = "daleris-open"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# What Windows runs for a folder or for Win + E. It's copied to each person's own folder and outlives an uninstall,
# since that's when it's needed most: it puts Explorer back rather than leave folders that won't open.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

[target.'cfg(windows)'.dependencies]
daleris-integration = { path = "../integration" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]
