[package]
name = "daleris-dialogs"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

# The in-process COM server behind "Open and Save dialogs use Daleris". It runs inside other people's apps, so it does
# very little there and never takes them down: see src/lib.rs. It must unwind on a panic so every entry point can catch
# it, which is why the workspace never sets panic = "abort".
[lib]
name = "daleris_dialogs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.58"

[target.'cfg(windows)'.dependencies]
daleris-integration = { path = "../integration" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
]
