name: Release

# Started by hand: Actions -> Release -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, to check it's the one in Cargo.toml (empty: use Cargo.toml's)"
        required: false
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
      publish:
        description: "Publish the release (off: only build and test, files stay on the run)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          WANTED: ${{ inputs.version }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -n "$WANTED" ] && [ "$v" != "$WANTED" ]; then
            echo "Cargo.toml says $v, the input says $WANTED"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          cargo build --release --locked --workspace
          rustup target add i686-pc-windows-msvc
          cargo build --release --locked --target i686-pc-windows-msvc -p daleris-dialogs

      - name: Install installer tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          dotnet tool install --global wix --version 5.0.2
          $env:DOTNET_ROLL_FORWARD = 'Major'
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { throw "wix extension failed" }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installers and portable files
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          installer\windows\package.ps1

      - name: Test installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = "daleris-v$env:VERSION-windows-x64"
          $exe = "$env:ProgramFiles\Daleris\daleris.exe"
          . installer\windows\test-lib.ps1
          $p = Start-Process "dist\$base-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path $exe)) { throw "setup.exe did not install" }
          schtasks /Query /TN 'Daleris Updater' 2>$null
          if ($LASTEXITCODE) { throw "setup.exe didn't add the update task" }
          Assert-Locked "$env:ProgramFiles\Daleris"
          if (-not (Test-Path "$env:ProgramFiles\Daleris\machine-install.txt")) { throw "setup.exe didn't mark a PC-wide install" }
          $p = Start-Process "$env:ProgramFiles\Daleris\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 5
          if ($p.ExitCode -or (Test-Path $exe)) { throw "setup.exe did not uninstall" }
          $msi = (Resolve-Path "dist\$base.msi").Path
          $p = Start-Process msiexec -ArgumentList '/i',"`"$msi`"",'/qn','/norestart','ALLUSERS=1' -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path $exe)) { throw "MSI did not install: $($p.ExitCode)" }
          if (-not (Test-Path "$env:ProgramFiles\Daleris\LICENSE.txt")) { throw "MSI did not install the licence" }

          # The Start menu shortcut has to be a normal link, with the app's ID, and Windows has to list the app.
          $menu = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs"
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut("$menu\Daleris.lnk").TargetPath
          if ($target -ne $exe) { throw "The shortcut points to '$target'" }
          $iconPath = (New-Object -ComObject WScript.Shell).CreateShortcut("$menu\Daleris.lnk").IconLocation
          if ($iconPath -match 'Installer') { throw "The shortcut's icon is in a folder upgrades delete: $iconPath" }
          $id = (New-Object -ComObject Shell.Application).NameSpace($menu).ParseName('Daleris.lnk').ExtendedProperty('System.AppUserModel.ID')
          if ($id -ne 'MyDrift.Daleris') { throw "The shortcut's app ID is '$id'" }
          function Listed { @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'Daleris') }
          if ((Listed).Count -ne 1) { throw "Windows lists Daleris $((Listed).Count) times" }

          # A PC-wide install gets the task that installs updates silently, and loses it again.
          function Task { schtasks /Query /TN 'Daleris Updater' 2>$null; $LASTEXITCODE -eq 0 }
          if (-not (Task)) { throw "The MSI didn't add the update task" }

          $p = Start-Process msiexec -ArgumentList '/x',"`"$msi`"",'/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path $exe) -or (Test-Path "$menu\Daleris.lnk")) { throw "MSI did not uninstall: $($p.ExitCode)" }
          if (Task) { throw "Uninstalling the MSI left the update task" }

          # For one account: in their own folder, with no task.
          $own = "$env:LOCALAPPDATA\Programs\Daleris\daleris.exe"
          $p = Start-Process msiexec -ArgumentList '/i',"`"$msi`"",'/qn','/norestart','ALLUSERS=2','MSIINSTALLPERUSER=1' -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path $own)) { throw "MSI did not install for one account: $($p.ExitCode)" }
          if (Task) { throw "A per-user MSI added the update task" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\Daleris\machine-install.txt") { throw "A per-user MSI was marked as PC-wide" }
          $p = Start-Process msiexec -ArgumentList '/x',"`"$msi`"",'/qn','/norestart','ALLUSERS=2','MSIINSTALLPERUSER=1' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path $own)) { throw "MSI did not uninstall for one account: $($p.ExitCode)" }

          # A chosen folder, without any screens.
          $dir = 'C:\Apps\Daleris Test'
          $p = Start-Process msiexec -ArgumentList '/i',"`"$msi`"",'/qn','/norestart',"ALLUSERS=1","APPLICATIONFOLDER=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path "$dir\daleris.exe")) { throw "MSI did not install into a chosen folder: $($p.ExitCode)" }
          Assert-Locked $dir
          if (-not (Test-Path "$dir\machine-install.txt")) { throw "The MSI didn't mark a PC-wide install in a chosen folder" }
          $p = Start-Process msiexec -ArgumentList '/x',"`"$msi`"",'/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path "$dir\daleris.exe")) { throw "MSI did not uninstall from a chosen folder: $($p.ExitCode)" }

          # Installing over the published release has to replace it, for this PC and for one account alike.
          New-Item -ItemType Directory old | Out-Null
          gh release download --repo "$env:GITHUB_REPOSITORY" --pattern 'daleris-*.msi' --dir old
          $previous = Get-ChildItem old -Filter *.msi | Select-Object -First 1
          if ($previous) {
            function ListedAnywhere { @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'Daleris') }
            foreach ($scope in @(@('ALLUSERS=1'), @('ALLUSERS=2', 'MSIINSTALLPERUSER=1'))) {
              $installed = if ($scope.Count -eq 1) { $exe } else { $own }
              $p = Start-Process msiexec -ArgumentList (@('/i', "`"$($previous.FullName)`"", '/qn', '/norestart') + $scope) -Wait -PassThru
              if ($p.ExitCode) { throw "The published MSI did not install: $($p.ExitCode)" }
              $p = Start-Process msiexec -ArgumentList (@('/i', "`"$msi`"", '/qn', '/norestart') + $scope) -Wait -PassThru
              if ($p.ExitCode) { throw "MSI did not upgrade: $($p.ExitCode)" }
              if ((ListedAnywhere).Count -ne 1) { throw "After upgrading ($scope), Windows lists Daleris $((ListedAnywhere).Count) times" }
              if ((ListedAnywhere)[0].DisplayVersion -ne $env:VERSION) { throw "After upgrading ($scope), Windows lists version $((ListedAnywhere)[0].DisplayVersion)" }
              $p = Start-Process msiexec -ArgumentList (@('/x', "`"$msi`"", '/qn', '/norestart') + $scope) -Wait -PassThru
              if ($p.ExitCode -or (Test-Path $installed)) { throw "MSI did not uninstall after upgrading ($scope): $($p.ExitCode)" }
            }
          }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, because a program only runs on systems with at least the glibc it was built on.
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      NAME: ${{ matrix.name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install libraries and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev \
            libxkbcommon-x11-0 libxcb-xkb1 libxcursor1 libxi6 libxrender1 libxfixes3 patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: bash installer/linux/package.sh

      - name: Test packages on clean systems
        run: |
          base="dist/daleris-v$VERSION-$NAME"
          check() { docker run --rm -v "$PWD:/w" -w /w "$1" sh installer/linux/test-package.sh "$2" "$3"; }
          check debian:stable "$base.deb" "$NAME-debian-deb"
          check fedora:latest "$base.rpm" "$NAME-fedora-rpm"
          check debian:stable "$base.AppImage" "$NAME-debian-appimage"
          check fedora:latest "$base.AppImage" "$NAME-fedora-appimage"
          if [ "$NAME" = linux-x64 ]; then
            check ubuntu:22.04 "$base.deb" "$NAME-ubuntu-deb"
            check opensuse/tumbleweed "$base.rpm" "$NAME-opensuse-rpm"
            check archlinux:latest "$base.pkg.tar.zst" "$NAME-arch-pkg"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-${{ matrix.name }}
          path: screens/*

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
    runs-on: ${{ matrix.os }}
    env:
      NAME: ${{ matrix.name }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: bash installer/macos/package.sh

      - name: Test packages
        run: bash installer/macos/test-package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-${{ matrix.name }}
          path: screens/*

  # Every kind of install really updates itself, from the old version to a new one, with a throwaway key.
  update-test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      NAME: ${{ matrix.name }}
      VERSION: ${{ needs.version.outputs.version }}
      DOTNET_ROLL_FORWARD: Major
    steps:
      - uses: actions/checkout@v7

      - name: Install libraries and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev \
            libxkbcommon-x11-0 libxcb-xkb1 libxcursor1 libxi6 libxrender1 libxfixes3 patchelf

      - name: Install installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          dotnet tool install --global wix --version 5.0.2
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE) { throw "wix extension failed" }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build two versions
        shell: bash
        run: bash installer/test/build-two-versions.sh

      - name: Update (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: installer\windows\test-update.ps1

      - name: Update (Linux)
        if: runner.os == 'Linux'
        run: bash installer/linux/test-update.sh

      - name: Update (macOS)
        if: runner.os == 'macOS'
        run: bash installer/macos/test-update.sh

  release:
    if: inputs.publish
    needs: [version, windows, linux, macos, update-test]
    runs-on: ubuntu-latest
    # Holds the signing key, and waits for an approval on GitHub before it runs.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Sign the update list
        env:
          UPDATE_KEY: ${{ secrets.DALERIS_UPDATE_KEY }}
        run: |
          [ -n "$UPDATE_KEY" ] || { echo "The DALERIS_UPDATE_KEY secret is missing"; exit 1; }
          cd dist
          { echo "version $VERSION"; sha256sum -- * | sed -E 's/^([0-9a-f]+) +\*?/file \1 /'; } > latest.json
          printf '%s\n' "$UPDATE_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in latest.json -out latest.json.sig
          rm -f "$RUNNER_TEMP/key.pem"
          cat latest.json
          # the program itself has to accept it, with the key built into it
          binary="$RUNNER_TEMP/daleris"
          cp "daleris-v$VERSION-linux-x64" "$binary"
          chmod +x "$binary"
          HOME="$RUNNER_TEMP" "$binary" --verify-manifest latest.json latest.json.sig
          echo tampered >> "$RUNNER_TEMP/changed.json"
          cat latest.json >> "$RUNNER_TEMP/changed.json"
          if HOME="$RUNNER_TEMP" "$binary" --verify-manifest "$RUNNER_TEMP/changed.json" latest.json.sig; then
            echo "A changed list was accepted"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # People update to the newest number, so a version can't change once it's out.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released. Raise the version in Cargo.toml."
            exit 1
          fi
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          # An upload can fail while GitHub is having trouble, so start over from a clean slate a few times.
          for attempt in 1 2 3 4; do
            gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Daleris v$VERSION" --generate-notes "${flags[@]}" && exit 0
            sleep 60
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
          exit 1
