name: Release

# Started by hand: Actions -> Release -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.0)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version matches Cargo.toml
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$v" = "$VERSION" ] || { echo "Cargo.toml says $v, input says $VERSION"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Install installer tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installers and portable files
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          $base = "bolt-explorer-v$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" "/DOutputName=$base-setup" installer\setup.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }
          wix build -arch x64 -d "Version=$env:VERSION" -o "dist\$base.msi" installer\app.wxs
          if ($LASTEXITCODE) { throw "wix failed" }
          Remove-Item dist*.wixpdb
          Copy-Item target\release\bolt-explorer.exe "dist\$base-portable.exe"
          Compress-Archive -Path target\release\bolt-explorer.exe -DestinationPath "dist\$base.zip"
          Compress-Archive -Path policy\* -DestinationPath "dist\bolt-explorer-v$env:VERSION-policy-definitions.zip"

      - name: Test installers
        shell: pwsh
        run: |
          $base = "bolt-explorer-v$env:VERSION-windows-x64"
          $exe = "$env:ProgramFiles\Bolt Explorer\bolt-explorer.exe"
          $p = Start-Process "dist\$base-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path $exe)) { throw "setup.exe did not install" }
          $p = Start-Process "$env:ProgramFiles\Bolt Explorer\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 5
          if ($p.ExitCode -or (Test-Path $exe)) { throw "setup.exe did not uninstall" }
          $msi = (Resolve-Path "dist\$base.msi").Path
          $p = Start-Process msiexec -ArgumentList '/i',"`"$msi`"",'/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path $exe)) { throw "MSI did not install: $($p.ExitCode)" }
          $p = Start-Process msiexec -ArgumentList '/x',"`"$msi`"",'/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -or (Test-Path $exe)) { throw "MSI did not uninstall: $($p.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  unix:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        env:
          NAME: ${{ matrix.name }}
        run: |
          base="bolt-explorer-v$VERSION-$NAME"
          mkdir dist
          cp target/release/bolt-explorer "dist/$base"
          tar czf "dist/$base.tar.gz" -C target/release bolt-explorer

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [windows, unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Bolt Explorer v$VERSION" --generate-notes "${flags[@]}"
