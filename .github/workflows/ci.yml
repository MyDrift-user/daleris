name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libwayland-dev libx11-dev libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libgl1-mesa-dri xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace
      - run: cargo test --release --locked --workspace
      - name: Run the program (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" bash installer/smoke-test.sh
      - name: Run the program (macOS)
        if: runner.os == 'macOS'
        run: bash installer/smoke-test.sh
      - uses: actions/upload-artifact@v7
        if: always() && runner.os != 'Windows'
        with:
          name: smoke-${{ matrix.os }}
          path: screens/*
